services:
  postgres:
    image: postgres:16
    container_name: cnes_health_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: cnes_health_user
      POSTGRES_PASSWORD: cnes_health_password
      POSTGRES_DB: cnes_health_db

    ports:
      - "5432:5432"

    volumes:
      - cnes_health_postgres_data:/var/lib/postgresql/data

volumes:
  cnes_health_postgres_data:
